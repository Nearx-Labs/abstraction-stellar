<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abstraction — MetaAccount</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        margin-right: 0.5rem;
        cursor: pointer;
      }
      #status {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #f4f4f5;
        border-radius: 8px;
        word-break: break-all;
        white-space: pre-wrap;
      }
      a { color: #2563eb; }
      #contracts {
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #71717a;
      }
      #contracts summary { cursor: pointer; }
      #contracts li { margin: 0.3rem 0; }
      @media (prefers-color-scheme: dark) {
        body { background: #18181b; color: #e4e4e7; }
        #status { background: #27272a; }
        a { color: #60a5fa; }
        #contracts { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <h1>Abstraction</h1>
    <p>
      Smart account na Stellar com login por passkey — sem seed phrase, sem
      XLM na mão do usuário.
    </p>
    <div>
      <button id="create">Criar conta com passkey</button>
      <button id="connect">Entrar</button>
      <button id="send" hidden>Enviar 1 XLM (fee patrocinada)</button>
      <button id="disconnect" hidden>Sair</button>
    </div>
    <div id="status">Desconectado.</div>
    <details id="contracts">
      <summary>Contratos no testnet (stellar.expert)</summary>
      <ul id="contracts-list"></ul>
    </details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
