name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contratos (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  back:
    name: back (typecheck + testes)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abstraction
          POSTGRES_PASSWORD: abstraction
          POSTGRES_DB: abstraction
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abstraction -d abstraction"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/back
    env:
      DATABASE_URL: postgres://abstraction:abstraction@localhost:5432/abstraction
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/back/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A spec é escrita à mão; o teste acima já garante que ela cobre as rotas
      # registradas, e este passo confere que o documento é OpenAPI válido.
      - run: npm run openapi:export
      - run: npx --yes @redocly/cli@latest lint openapi.json
      - name: openapi.json commitado está em dia
        run: git diff --exit-code openapi.json

  fixture:
    name: vetor de attestation não pode divergir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/back/package-lock.json
      - run: npm ci
        working-directory: apps/back
      # O arquivo é lido por include_str! no teste Rust do
      # email-attestation-verifier. Se o serviço passar a emitir outro
      # encoding, o contrato rejeitaria em produção e só o teste Rust veria —
      # este diff falha antes disso.
      - name: gerar e comparar
        working-directory: apps/back
        # `--silent` não é preciosismo: sem ele o npm escreve o próprio cabeçalho
        # ("> abstraction-back@0.1.0 fixture") no stdout, ele entra na captura e
        # o diff falha com três linhas a mais — parecendo divergência de
        # encoding quando o vetor está idêntico.
        run: |
          npm run --silent fixture > /tmp/vector.txt
          diff -u ../../contracts/email-attestation-verifier/fixtures/js_attestation_vector.txt /tmp/vector.txt

  front:
    name: front (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/front/package-lock.json
      - run: npm ci
      # Duas cópias do stellar-sdk fazem o Spec do kit rejeitar os ScVal que
      # este app constrói, com um erro que não diz nada sobre versão.
      - run: npm run check-sdk
      # Campos tipados como Val no contrato só aceitam ScVal pronto; o erro que
      # sai quando não é não aponta para a causa.
      - run: npm run check-args
      - run: npm run typecheck
      - run: npm run build

  client:
    name: client tipado
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: npm ci
      # Os tipos são gerados da spec: regenerar aqui e exigir diff vazio é o que
      # garante que o cliente publicado corresponde à API.
      - run: npm run generate
      - name: schema.d.ts está em dia com o openapi.json
        run: git diff --exit-code src/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: imagens docker
    runs-on: ubuntu-latest
    needs: [back, front]
    # `packages: write` é o que autoriza o push no GHCR; `contents: read` volta a
    # ser explícito porque declarar o bloco zera os defaults do repositório.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Em pull request o push fica desligado: o token de um PR vindo de fork não
      # tem `packages: write`, e mesmo com permissão publicar imagem de código
      # ainda não revisado é o tipo de coisa que ninguém quer descobrir depois.
      # O GHCR só aceita nome de imagem em minúsculas, e a org é "Nearx-Labs".
      # Deixar explícito em vez de confiar na normalização do metadata-action:
      # o erro seria um push recusado no fim de um build de 2 minutos.
      - name: nome da imagem em minúsculas
        id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha` dá uma tag imutável por commit — é o que se referencia num
      # rollback. `latest` sozinho não diz qual código está rodando.
      - name: tags do back
        id: meta_back
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.lc }}/back
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: apps/back
          push: ${{ github.event_name != 'pull_request' }}
          # Vai para /health, para dar resposta a "qual build está no ar?".
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta_back.outputs.tags }}
          labels: ${{ steps.meta_back.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: tags do front
        id: meta_front
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.lc }}/front
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: apps/front
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_front.outputs.tags }}
          labels: ${{ steps.meta_front.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
