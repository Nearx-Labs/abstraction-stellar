name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contratos (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  back:
    name: back (typecheck + testes)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abstraction
          POSTGRES_PASSWORD: abstraction
          POSTGRES_DB: abstraction
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abstraction -d abstraction"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/back
    env:
      DATABASE_URL: postgres://abstraction:abstraction@localhost:5432/abstraction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/back/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A spec é escrita à mão; o teste acima já garante que ela cobre as rotas
      # registradas, e este passo confere que o documento é OpenAPI válido.
      - run: npm run openapi:export
      - run: npx --yes @redocly/cli@latest lint openapi.json
      - name: openapi.json commitado está em dia
        run: git diff --exit-code openapi.json

  fixture:
    name: vetor de attestation não pode divergir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/back/package-lock.json
      - run: npm ci
        working-directory: apps/back
      # O arquivo é lido por include_str! no teste Rust do
      # email-attestation-verifier. Se o serviço passar a emitir outro
      # encoding, o contrato rejeitaria em produção e só o teste Rust veria —
      # este diff falha antes disso.
      - name: gerar e comparar
        working-directory: apps/back
        run: |
          npm run fixture > /tmp/vector.txt
          diff -u ../../contracts/email-attestation-verifier/fixtures/js_attestation_vector.txt /tmp/vector.txt

  front:
    name: front (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/front/package-lock.json
      - run: npm ci
      # Duas cópias do stellar-sdk fazem o Spec do kit rejeitar os ScVal que
      # este app constrói, com um erro que não diz nada sobre versão.
      - run: npm run check-sdk
      # Campos tipados como Val no contrato só aceitam ScVal pronto; o erro que
      # sai quando não é não aponta para a causa.
      - run: npm run check-args
      - run: npm run typecheck
      - run: npm run build

  images:
    name: imagens docker
    runs-on: ubuntu-latest
    needs: [back, front]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/back
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: apps/front
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
